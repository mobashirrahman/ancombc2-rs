[workspace]
resolver = "2"
members = [
    "crates/ancombc2-core",
    "crates/ancombc2-stats",
    "crates/ancombc2-io",
    "crates/ancombc2-cli",
    "crates/ancombc2-ffi",
    "crates/ancombc2-rbridge",
    "crates/ancombc2-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Artistic-2.0"
repository = "https://github.com/FrederickHuangLin/ANCOMBC"
authors = ["ancombc2-rs contributors"]

[workspace.dependencies]
ancombc2-core = { path = "crates/ancombc2-core", version = "0.1.0" }
ancombc2-stats = { path = "crates/ancombc2-stats", version = "0.1.0" }
ancombc2-io = { path = "crates/ancombc2-io", version = "0.1.0" }
rayon = "1.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
faer = "0.19"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
